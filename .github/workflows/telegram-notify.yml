name: Telegram notification

on:
  workflow_run:
    workflows: ["Playwright CI"]
    types: [completed]

permissions: {}

jobs:
  notify:
    name: Notify about successful CI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail

          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Не заданы TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID"
            exit 1
          fi

          MESSAGE=$(printf \
            '✅ Playwright CI успешно завершён\nРепозиторий: %s\nВетка: %s\nЗапуск: #%s\n%s' \
            "$REPOSITORY" "$BRANCH" "$RUN_NUMBER" "$RUN_URL")

          curl --silent --show-error --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" \
            | jq -e '.ok == true' > /dev/null

          echo "Сообщение отправлено"